[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rpdcnn"
version = "0.1.0"
description = "RPDCNN: a multi-task perception model for detection and polygon-aware segmentation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
	"numpy>=1.24",
	"opencv-python-headless>=4.8",
	"timm>=1.0.0",
	"torch>=2.1",
	"torchvision>=0.16",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
